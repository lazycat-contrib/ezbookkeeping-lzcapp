version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: ezbookkeeping
build:
  toolchains: []
  run_buildscript: false
images:
  - id: ezbookkeeping
    target: service
    service: ezbookkeeping
    source: mayswind/ezbookkeeping
    channel: stable
    sort: semver
    # Tags are plain x.y.z (2.1.1, 2.1.0, ...); ^v? kept for safety.
    tag_regex: ^v?[0-9]+[.][0-9]+[.][0-9]+$
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: ezBookkeeping
    skip_if_version_exists: true
